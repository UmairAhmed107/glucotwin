# ==============================================================================
# GlucoTwin - Optional Docker Compose
# NOTE: Docker is OPTIONAL. Native laptop setup via run_dev.ps1 or run_dev.sh
# is the recommended primary workflow for live demonstration.
# ==============================================================================

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glucotwin-backend
    ports:
      - "8000:8000"
    environment:
      - MOCK_GEMINI=true
      - DATABASE_URL=sqlite:///./glucotwin.db
      - MODELS_DIR=/app/models
      - REPLAY_DATA_PATH=models/cgm_timeseries.csv
    volumes:
      - ./backend/glucotwin.db:/app/glucotwin.db
      - ./backend/models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: glucotwin-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    restart: unless-stopped
